[project]
name = "video-player"
version = "0.1.0"
description = "Editor desktop de capítulos, legendas e elenco para vídeos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "python-vlc>=3.0.21203",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
    "ruff>=0.12.0",
]

[tool.black]
line-length = 120
target-version = ["py312"]
